name: MA200 daglig kontroll

on:
  schedule:
    - cron: "7 17 * * 1-5"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests
      - run: python ma200_notiser.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
